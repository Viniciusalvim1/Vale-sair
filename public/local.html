<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee5d2">
  <title>Lugar · Vale Sair?</title>
  <meta name="description" content="Movimento, fila e chat ao vivo de um lugar de BH.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/boot.js"></script>
  <script type="module" src="js/paginas/local.js"></script>
</head>
<body data-pagina="local" data-nav="agora" data-detalhe>
  <div class="shell">
    <main class="app">
      <div class="tela" id="tela"><div class="carregando" role="status">CARREGANDO...</div></div>
    </main>
  </div>
  <dialog class="modal streetview-modal" id="streetViewDialog" aria-labelledby="streetViewTitulo">
    <div class="sheet streetview-sheet">
      <div class="sheet-head">
        <div><div class="kicker">VISÃO DA RUA · GOOGLE MAPS</div><h2 id="streetViewTitulo">STREET VIEW</h2></div>
        <button class="close" type="button" data-fechar aria-label="Fechar Street View">
          <svg class="ui-icon" aria-hidden="true"><use href="assets/icons.svg#i-close"></use></svg>
        </button>
      </div>
      <div class="streetview-status" id="streetViewEstado" role="status">PROCURANDO STREET VIEW...</div>
      <div class="streetview-canvas" id="streetViewCanvas" hidden></div>
    </div>
  </dialog>
</body>
</html>
