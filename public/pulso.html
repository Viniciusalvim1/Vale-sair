<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee5d2">
  <title>Novo Pulso · Vale Sair?</title>
  <meta name="description" content="Mostre como o lugar está agora: sem filtro, válido por 2 horas.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/boot.js"></script>
  <script type="module" src="js/paginas/pulso.js"></script>
</head>
<body data-pagina="pulso" data-nav="chama" data-detalhe>
  <div class="shell">
    <main class="app">
      <div class="tela">
        <div class="flow-head">
          <a class="back" href="chama.html" data-voltar aria-label="Voltar"><svg class="ui-icon" aria-hidden="true"><use href="assets/icons.svg#i-chevron"></use></svg></a>
          <div><h1>NOVO<br>PULSO</h1><p>Sem filtro. Gravado agora. Expira em 2 horas.</p></div>
        </div>

        <form id="formPulso" novalidate>
          <div class="campo">
            <label for="local">Onde você está?</label>
            <select id="local" required><option value="">Escolha o lugar</option></select>
          </div>

          <div class="camera-stage" id="palco">
            <div class="camera-vazia" id="cameraVazia">
              <svg class="ui-icon" aria-hidden="true"><use href="assets/icons.svg#i-camera"></use></svg>
              <span>TOQUE NO BOTÃO VERMELHO PARA FOTOGRAFAR OU GRAVAR ATÉ 7 SEGUNDOS</span>
            </div>
            <div class="camera-top"><span class="camera-tag" id="tagLocal">ESCOLHA O LUGAR</span><span>ATÉ 7 SEGUNDOS</span></div>
            <div class="camera-bottom">
              <strong>COMO ESTÁ?</strong>
              <div class="mood-row" role="group" aria-label="Movimento">
                <button class="mood" type="button" data-movimento="tranquilo" aria-pressed="false">TRANQUILO</button>
                <button class="mood" type="button" data-movimento="animado" aria-pressed="false">ANIMADO</button>
                <button class="mood" type="button" data-movimento="cheio" aria-pressed="false">CHEIO</button>
                <button class="mood" type="button" data-movimento="lotado" aria-pressed="false">LOTADO</button>
              </div>
              <div class="mood-row" role="group" aria-label="Fila">
                <button class="mood" type="button" data-fila="0" aria-pressed="false">SEM FILA</button>
                <button class="mood" type="button" data-fila="10" aria-pressed="false">ATÉ 10 MIN</button>
                <button class="mood" type="button" data-fila="20" aria-pressed="false">10 A 30 MIN</button>
                <button class="mood" type="button" data-fila="45" aria-pressed="false">30 MIN+</button>
              </div>
            </div>
          </div>

          <div class="record-wrap">
            <label class="record-button" for="arquivo" aria-hidden="true"><svg class="ui-icon"><use href="assets/icons.svg#i-camera"></use></svg></label>
            <input class="sr-only" id="arquivo" type="file" accept="image/*,video/*" capture="environment" aria-label="Fotografar ou gravar o Pulso">
            <small id="infoArquivo">Sem mídia, o Pulso vira só um aviso de movimento.</small>
          </div>

          <div class="campo">
            <label for="legenda">Legenda (opcional)</label>
            <input id="legenda" maxlength="80" placeholder="Ex.: o DJ acabou de começar">
          </div>
          <button class="physical blue full" type="submit" id="publicar">PUBLICAR PULSO</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
